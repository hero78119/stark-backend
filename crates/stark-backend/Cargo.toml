[package]
name = "openvm-stark-backend"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
description = "Multi-matrix STARK backend for the SWIRL proof system"

[dependencies]
openvm-codec-derive.workspace = true

p3-air.workspace = true
p3-challenger.workspace = true
p3-dft.workspace = true
p3-field.workspace = true
p3-interpolation.workspace = true
p3-matrix.workspace = true
p3-maybe-rayon.workspace = true
p3-symmetric.workspace = true
p3-util.workspace = true
p3-baby-bear = { workspace = true, optional = true }

p3-whir-08 = { workspace = true, optional = true }
p3-commit-08 = { workspace = true, optional = true }
p3-challenger-08 = { workspace = true, optional = true }
p3-dft-08 = { workspace = true, optional = true }
p3-field-08 = { workspace = true, optional = true }
p3-matrix-08 = { workspace = true, optional = true }
p3-baby-bear-08 = { workspace = true, optional = true }
p3-poseidon2-08 = { workspace = true, optional = true }
p3-merkle-tree-08 = { workspace = true, optional = true }
p3-multilinear-util-08 = { workspace = true, optional = true }
p3-maybe-rayon-08 = { workspace = true, optional = true }
p3-symmetric-08 = { workspace = true, optional = true }
p3-security-08 = { workspace = true, optional = true }
p3-sumcheck-08 = { workspace = true, optional = true }
p3-zk-codes-08 = { workspace = true, optional = true }
rand-10 = { workspace = true, optional = true }

itertools.workspace = true
rayon.workspace = true
hex-literal.workspace = true
serde = { workspace = true, features = [
    "derive",
    "alloc",
    "rc",
] }
derive-new.workspace = true
tracing.workspace = true
getset.workspace = true
cfg-if.workspace = true
thiserror.workspace = true
eyre.workspace = true
derivative.workspace = true
postcard = { workspace = true, features = ["alloc"] }
num-bigint = { workspace = true, optional = true }
rustc-hash.workspace = true
serde_json.workspace = true
metrics = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
tikv-jemallocator = { version = "0.6", optional = true }

mimalloc = { version = "0.1.43", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom-04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
openvm-stark-backend = { path = ".", default-features = false, features = ["test-utils"] }
openvm-stark-sdk = { path = "../stark-sdk", default-features = false } # dev-dependency is not circular
openvm-backend-tests = { path = "../backend-tests", default-features = false }
p3-baby-bear.workspace = true
p3-bn254.workspace = true
rand.workspace = true
test-case.workspace = true

[features]
default = ["parallel", "metrics"]
parallel = [
    "p3-maybe-rayon/parallel",
    "p3-whir-08?/parallel",
    "p3-maybe-rayon-08?/parallel",
]
hiding-whir = [
    "dep:p3-baby-bear",
    "dep:p3-whir-08",
    "dep:p3-commit-08",
    "dep:p3-challenger-08",
    "dep:p3-dft-08",
    "dep:p3-field-08",
    "dep:p3-matrix-08",
    "dep:p3-baby-bear-08",
    "dep:p3-poseidon2-08",
    "dep:p3-merkle-tree-08",
    "dep:p3-multilinear-util-08",
    "dep:p3-maybe-rayon-08",
    "dep:p3-symmetric-08",
    "dep:p3-security-08",
    "dep:p3-sumcheck-08",
    "dep:p3-zk-codes-08",
    "dep:rand-10",
]
jemalloc = ["dep:tikv-jemallocator"]
jemalloc-prof = ["jemalloc", "tikv-jemallocator?/profiling"]
metrics = ["dep:metrics"]
multi-field-transcript = ["dep:num-bigint"]
test-utils = []
lean = ["openvm-codec-derive/lean"] # feature for Lean constraint codegen
soundness-bchks25-optimized = [] # use brute force optimized parameters for [BCHKS25] proximity gaps security
